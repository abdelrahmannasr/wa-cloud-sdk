version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10
    groups:
      # The @typescript-eslint packages (parser, eslint-plugin) and the
      # typescript-eslint meta-package are a single monorepo released in
      # lockstep and must move together. Bumping one in isolation leaves the
      # pnpm lockfile internally inconsistent (a dangling reference to the
      # old version) and crashes `pnpm install --frozen-lockfile`. Grouping
      # them into one PR keeps the lockfile consistent.
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
    ignore:
      # @types/node should track the engines.node minimum LTS, not the
      # latest Node release. We declare engines.node: ">=18.0.0", so types
      # for Node 25+ APIs would advertise a runtime surface we do not
      # support. Patch and minor bumps within the current major are fine.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci):"
