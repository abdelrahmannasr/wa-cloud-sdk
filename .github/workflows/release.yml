name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required secrets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          missing=()
          [ -z "$NPM_TOKEN" ] && missing+=("NPM_TOKEN")
          [ -z "$SSH_SIGNING_KEY" ] && missing+=("SSH_SIGNING_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Provision them at: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          # NPM_TOKEN is required only until npm Trusted Publishing is
          # configured for this package on npmjs.com. After the first
          # release lands and you register a trusted publisher, the
          # token can be revoked and this check can drop it.

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure SSH commit signing
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
          SIGNER_NAME: AbdelRahman Nasr
          SIGNER_EMAIL: a.nasr.yocto@gmail.com
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key.pub
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.name "$SIGNER_NAME"
          git config --global user.email "$SIGNER_EMAIL"

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Open release-failure tracking issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const title = `Release failed for ${sha.substring(0, 7)}`;
            const body = [
              `Automated release workflow failed.`,
              ``,
              `- Commit: ${sha}`,
              `- Run: ${runUrl}`,
              ``,
              `Please investigate and either fix-forward or revert.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure',
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['release-failure'],
              });
            }
