name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required secrets
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
          RELEASE_BOT_PAT: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          missing=()
          [ -z "$SSH_SIGNING_KEY" ] && missing+=("SSH_SIGNING_KEY")
          [ -z "$RELEASE_BOT_PAT" ] && missing+=("RELEASE_BOT_PAT")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Provision them at: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          # npm publish auths via Trusted Publishing (OIDC) — no
          # NPM_TOKEN needed. The id-token: write permission on this
          # workflow + the trusted-publisher entry registered for
          # wa-cloud-sdk on npmjs.com handle auth
          # tokenlessly and attach provenance via sigstore.
          # RELEASE_BOT_PAT is the maintainer's fine-grained PAT used by
          # semantic-release to push the chore(release) commit back to
          # main, bypassing branch protection (PR-required and
          # status-checks-required) via enforce_admins=false. Rotate
          # alongside SSH_SIGNING_KEY per FR-041 / SC-016.

      - name: Validate RELEASE_BOT_PAT can push
        env:
          RELEASE_BOT_PAT: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          # Fail fast (in seconds) on an expired/revoked/under-scoped PAT
          # with an actionable message, instead of wasting the full
          # lint/test/build run only for semantic-release's git push to
          # die with a generic "Password authentication is not supported"
          # error. A fine-grained PAT silently expires; non-emptiness is
          # not enough — verify it actually authenticates AND can write.
          repo_url="https://x-access-token:${RELEASE_BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote "$repo_url" HEAD >/dev/null 2>&1; then
            echo "::error::RELEASE_BOT_PAT cannot authenticate to ${GITHUB_REPOSITORY} (expired, revoked, or wrong repo). Rotate it: gh secret set RELEASE_BOT_PAT"
            exit 1
          fi
          # Confirm write/push scope via the dry-run push semantic-release
          # itself performs in verifyConditions.
          if ! git push --dry-run --no-verify "$repo_url" "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::RELEASE_BOT_PAT authenticates but cannot push to ${GITHUB_REF_NAME}. Ensure it grants 'Contents: Read and write' on ${GITHUB_REPOSITORY}, then rotate: gh secret set RELEASE_BOT_PAT"
            exit 1
          fi
          echo "RELEASE_BOT_PAT validated: authenticates and has write scope for ${GITHUB_REF_NAME}."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure SSH commit signing
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
          SIGNER_NAME: AbdelRahman Nasr
          SIGNER_EMAIL: 37974483+abdelrahmannasr@users.noreply.github.com
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key.pub
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.name "$SIGNER_NAME"
          git config --global user.email "$SIGNER_EMAIL"

      - name: Semantic Release
        env:
          # Use the maintainer's fine-grained PAT (not the default
          # GITHUB_TOKEN) so semantic-release's @semantic-release/git
          # plugin can push the chore(release) commit back to main.
          # Default GITHUB_TOKEN cannot bypass branch protection; the
          # PAT acts as the admin user, which can with enforce_admins
          # disabled. Required-signatures still applies — the SSH
          # signing step above ensures the commit is verified.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: npx semantic-release

      - name: Open release-failure tracking issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const title = `Release failed for ${sha.substring(0, 7)}`;
            const body = [
              `Automated release workflow failed.`,
              ``,
              `- Commit: ${sha}`,
              `- Run: ${runUrl}`,
              ``,
              `Please investigate and either fix-forward or revert.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure',
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['release-failure'],
              });
            }
